<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NOVA Ultimate</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-block">
          <span class="status-dot"></span>
          <span class="brand-text">NOVA Ultimate</span>
        </div>
        <button id="statusButton" class="ghost-btn">System Status</button>
      </header>

      <main class="dashboard">
        <section class="hero panel">
          <div>
            <p class="eyebrow">AI PERSONAL ASSISTANT</p>
            <h1>Ready for intelligent operations</h1>
          </div>
          <div class="hero-tag" id="systemBadge">Operational</div>
        </section>

        <section class="stats-grid">
          <article class="stat-card panel">
            <label>System</label>
            <strong id="systemName">NOVA Ultimate</strong>
          </article>
          <article class="stat-card panel">
            <label>Version</label>
            <strong id="systemVersion">1.0.0</strong>
          </article>
          <article class="stat-card panel">
            <label>Groq</label>
            <strong id="groqStatus">Checking...</strong>
          </article>
          <article class="stat-card panel">
            <label>Features</label>
            <strong id="featureCount">0</strong>
          </article>
        </section>

        <section class="panel controls-panel">
          <div class="panel-header">
            <h2>Ask NOVA</h2>
          </div>
          <form id="assistantForm">
            <textarea id="messageInput" rows="4" placeholder="Ask NOVA to create a project, summarize a task, or help with planning..."></textarea>
            <div class="actions-row">
              <button type="submit" class="primary-btn">Send</button>
              <button type="button" id="predictButton" class="secondary-btn">Predict Intent</button>
            </div>
          </form>
        </section>

        <section class="two-col">
          <div class="panel response-panel">
            <div class="panel-header">
              <h2>Response</h2>
            </div>
            <div id="responseBox" class="response-box">
              NOVA is online and ready.
            </div>
          </div>

          <div class="panel scan-panel">
            <div class="panel-header">
              <h2>Security Scan</h2>
            </div>
            <form id="scanForm">
              <input id="scanInput" type="text" placeholder="https://example.com" />
              <button type="submit" class="secondary-btn">Scan URL</button>
            </form>
            <pre id="scanResult">Awaiting scan...</pre>
          </div>
        </section>

        <section class="panel prediction-panel">
          <div class="panel-header">
            <h2>Predicted Actions</h2>
          </div>
          <div id="predictions" class="predictions-box">
            Suggestions will appear here.
          </div>
        </section>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>

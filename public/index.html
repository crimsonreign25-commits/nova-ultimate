<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NOVA Ultimate v21.5.0</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="nova-theme">
  <div id="app" class="app-container">
    <aside class="sidebar">
      <div class="brand">
        <h2>NOVA <span>ULTIMATE</span></h2>
        <span class="version-badge">v21.5.0</span>
      </div>
      <button id="btn-new-chat" class="btn-primary">+ New Conversation</button>
      <div class="history-section">
        <h3>Conversations & Tasks</h3>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </aside>

    <main class="chat-viewport">
      <header class="chat-header">
        <div class="persona-selector">
          <label for="persona-select">Persona:</label>
          <select id="persona-select">
            <option value="nova">NOVA (Quantum Intelligence)</option>
            <option value="jarvis">JARVIS (Technical Engineer)</option>
            <option value="friday">FRIDAY (Tactical Analyst)</option>
            <option value="atlas">ATLAS (Architect)</option>
            <option value="lyra">LYRA (Creative Specialist)</option>
            <option value="orion">ORION (Security Specialist)</option>
          </select>
        </div>
        <div id="status-indicator" class="status-indicator">Engine Active</div>
      </header>

      <div id="chat-messages" class="chat-messages">
        <div class="message assistant-message">
          <div class="message-content">
            Hello! I am NOVA Ultimate v21.5.0. How can I assist you with reasoning, software engineering, research, or creative tasks today?
          </div>
        </div>
      </div>

      <div class="composer-container">
        <form id="chat-form" class="chat-form">
          <textarea id="user-input" placeholder="Ask NOVA anything or state 'Continue where we left off'..." rows="2" required></textarea>
          <button type="submit" id="btn-send" class="btn-send">Send</button>
        </form>
      </div>
    </main>
  </div>
  <script src="app.js"></script>
</body>
</html>
